<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полезные привычки — ежедневный трекер</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7078;
    --line: #e4e2dc;
    --accent: #2f9e6a;
    --accent-soft: #e3f4ec;
    --danger: #c9473d;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1e2125;
      --text: #e8e9eb;
      --muted: #9298a0;
      --line: #2e3238;
      --accent: #46c08a;
      --accent-soft: #1d3a2d;
      --danger: #e56a60;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { margin: 0; font-size: 26px; }
  header .tagline { margin: 4px 0 8px; color: var(--muted); font-size: 15px; }
  header .date { color: var(--text); font-weight: 600; margin-top: 2px; }
  header .date::first-letter { text-transform: uppercase; }
  .progress { margin: 4px 0 20px; }
  .progress-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .progress-text { font-size: 14px; color: var(--muted); margin-top: 6px; }

  form.add { display: flex; gap: 8px; margin-bottom: 20px; }
  form.add input {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  }
  form.add input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; }
  form.add button {
    padding: 0 18px; border: 0; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-weight: 600;
  }

  ul.habits { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .habit {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center;
  }
  .habit.done { border-color: var(--accent); }
  .check {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
    background: transparent; color: #fff; display: grid; place-items: center; grid-row: span 2;
  }
  .habit.done .check { background: var(--accent); border-color: var(--accent); }
  .check svg { width: 20px; height: 20px; opacity: 0; }
  .habit.done .check svg { opacity: 1; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .stats { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 14px; color: var(--muted); }
  .stats span { white-space: nowrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .actions { grid-row: span 2; display: flex; gap: 2px; }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted);
    width: 34px; height: 34px; border-radius: 8px; font-size: 18px; line-height: 1;
    display: grid; place-items: center;
  }
  .icon-btn:hover, .icon-btn.active { background: var(--bg); color: var(--text); }
  .icon-btn.delete { font-size: 22px; }
  .icon-btn.delete:hover { color: var(--danger); }
  .icon-btn svg { width: 18px; height: 18px; }

  .goal { grid-column: 1 / -1; margin-top: 8px; font-size: 14px; }
  .goal-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .goal-head b { color: var(--text); }
  .goal.reached .goal-head { color: var(--accent); font-weight: 600; }

  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel input[type=number] {
    width: 80px; padding: 6px 10px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  .link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 6px 4px; font-size: 14px; }

  details.catalog {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 20px; padding: 0 14px;
  }
  details.catalog summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
  details.catalog[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .cat { padding: 8px 0 12px; }
  .cat h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .chip.added { opacity: .45; cursor: default; }
  .chip.added:hover { border-color: var(--line); }
  .week { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 10px; }
  .day {
    flex: 1; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 4px 0; font-size: 12px; line-height: 1.2;
  }
  .day.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .day.today { font-weight: 700; }
  .day span { display: block; font-size: 11px; opacity: .8; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 16px; text-align: center; }

  .tabs { display: flex; gap: 4px; margin: 16px 0 4px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 9px 4px; border-radius: 10px; font-weight: 600; font-size: 15px; position: relative; }
  .tabs button.active { background: var(--accent-soft); color: var(--text); }
  .badge:not(:empty) { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 12px; line-height: 18px; }
  .view { padding-top: 12px; }

  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar .fill { height: 100%; background: var(--accent); }
  .panel { grid-column: 1 / -1; margin-top: 10px; padding: 12px; border-radius: 10px; background: var(--bg); font-size: 14px; }
  .panel p { margin: 0 0 8px; color: var(--muted); }
  .panel .row { margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .friends-line { grid-column: 1 / -1; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .friends-line b { color: var(--text); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card.center { text-align: center; }
  .card.muted { opacity: .75; }
  .card h2, h2.section { font-size: 17px; margin: 0 0 10px; }
  h2.section { margin: 22px 0 10px; }
  .small { font-size: 13px; color: var(--muted); }
  .card p { margin: 6px 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > input { flex: 1; min-width: 140px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stack { display: grid; gap: 10px; }
  .stack label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .card input:not([type=number]):not([type=checkbox]), .card select {
    padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; width: 100%;
  }
  .row > input { width: auto !important; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .small-btn { padding: 6px 10px; font-size: 14px; }
  .signin { display: grid; gap: 8px; max-width: 300px; margin: 14px auto; }
  .btn.apple { background: #000; color: #fff; border-color: #000; }
  .flash { margin: 8px 0 0; font-size: 14px; color: var(--accent); }
  .flash.error { color: var(--danger); }
  .link-btn.danger { color: var(--danger); }
  .account { text-align: center; margin-top: 28px; }
  .center-row { justify-content: center; }
  .nick { color: var(--muted); font-weight: 400; }
  .friend-name { font-weight: 600; }
  table.compare { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  .compare th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .compare td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .compare tr:last-child td { border-bottom: 0; }
  .compare td:not(:first-child), .compare th:not(:first-child) { white-space: nowrap; width: 1%; }
  .compare td.lead b { color: var(--accent); }
  .ch-title { font-weight: 700; font-size: 16px; }
  .prow { margin-top: 10px; font-size: 14px; }
  .prow.win .fill { background: #e0a526; }
  .prow.out .fill { background: var(--muted); }
  .result { font-weight: 600; margin: 10px 0 4px !important; }

  .fact { margin-top: 16px; background: var(--accent-soft); border-color: transparent; }
  .fact-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .fact p { margin: 8px 0 10px; }
  .person { padding: 10px 0; border-top: 1px solid var(--line); margin-top: 10px; }
  .person .small { margin-top: 4px; }
  .check-row { display: flex !important; gap: 10px; align-items: flex-start; color: var(--text) !important; font-size: 15px !important; cursor: pointer; }
  .check-row input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
  .indent { margin-left: 30px; }
  .or { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }
  .btn.whatsapp { background: #25d366; border-color: #25d366; color: #fff; }
  .invite-banner { border: 2px solid var(--accent); margin-top: 16px; }
  .invite-note { margin: 16px 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Полезные привычки</h1>
    <p class="tagline">Каждый день отмечайте, что сделали, и следите за сериями дней подряд</p>
    <div class="date" id="today"></div>
  </header>

  <div id="inviteBanner" hidden></div>

  <nav class="tabs">
    <button data-tab="habits">Мои привычки<span class="badge"></span></button>
    <button data-tab="friends">Друзья<span class="badge"></span></button>
    <button data-tab="challenges">Вызовы<span class="badge"></span></button>
  </nav>

  <section class="view" id="view-habits">
    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>

    <form class="add" id="addForm">
      <input id="newHabit" placeholder="Своя привычка, например «Зарядка»" maxlength="80" autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <details class="catalog" id="catalog">
      <summary>Выбрать из готового списка</summary>
      <div id="catalogBody"></div>
    </details>

    <ul class="habits" id="list"></ul>
    <div class="card fact" id="fact"></div>
    <p class="hint" id="hint">Нажмите на кружок, чтобы отметить привычку за сегодня. Дни недели внизу карточки — чтобы исправить прошлые отметки. 🎯 — поставить цель.</p>
  </section>

  <section class="view" id="view-friends" hidden></section>
  <section class="view" id="view-challenges" hidden></section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
