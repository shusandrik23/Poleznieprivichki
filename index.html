<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полезные привычки — ежедневный трекер</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7078;
    --line: #e4e2dc;
    --accent: #2f9e6a;
    --accent-soft: #e3f4ec;
    --danger: #c9473d;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1e2125;
      --text: #e8e9eb;
      --muted: #9298a0;
      --line: #2e3238;
      --accent: #46c08a;
      --accent-soft: #1d3a2d;
      --danger: #e56a60;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { margin: 0; font-size: 26px; }
  header .tagline { margin: 4px 0 8px; color: var(--muted); font-size: 15px; }
  header .date { color: var(--text); font-weight: 600; margin-top: 2px; }
  header .date::first-letter { text-transform: uppercase; }
  .progress { margin: 16px 0 20px; }
  .progress-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .progress-text { font-size: 14px; color: var(--muted); margin-top: 6px; }

  form.add { display: flex; gap: 8px; margin-bottom: 20px; }
  form.add input {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  }
  form.add input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; }
  form.add button {
    padding: 0 18px; border: 0; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-weight: 600;
  }

  ul.habits { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .habit {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center;
  }
  .habit.done { border-color: var(--accent); }
  .check {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
    background: transparent; color: #fff; display: grid; place-items: center; grid-row: span 2;
  }
  .habit.done .check { background: var(--accent); border-color: var(--accent); }
  .check svg { width: 20px; height: 20px; opacity: 0; }
  .habit.done .check svg { opacity: 1; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .stats { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 14px; color: var(--muted); }
  .stats span { white-space: nowrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .actions { grid-row: span 2; display: flex; gap: 2px; }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted);
    width: 34px; height: 34px; border-radius: 8px; font-size: 18px; line-height: 1;
    display: grid; place-items: center;
  }
  .icon-btn:hover, .icon-btn.active { background: var(--bg); color: var(--text); }
  .icon-btn.delete { font-size: 22px; }
  .icon-btn.delete:hover { color: var(--danger); }
  .icon-btn svg { width: 18px; height: 18px; }

  .goal { grid-column: 1 / -1; margin-top: 8px; font-size: 14px; }
  .goal-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .goal-head b { color: var(--text); }
  .goal-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .goal-fill { height: 100%; background: var(--accent); }
  .goal.reached .goal-head { color: var(--accent); font-weight: 600; }

  .goal-editor {
    grid-column: 1 / -1; margin-top: 10px; padding: 12px; border-radius: 10px;
    background: var(--bg); font-size: 14px;
  }
  .goal-editor p { margin: 0 0 8px; color: var(--muted); }
  .presets, .custom { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .custom { margin-top: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .custom input {
    width: 80px; padding: 6px 10px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  .link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 6px 4px; font-size: 14px; }

  details.catalog {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 20px; padding: 0 14px;
  }
  details.catalog summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
  details.catalog[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .cat { padding: 8px 0 12px; }
  .cat h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .cat .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip.added { opacity: .45; cursor: default; }
  .chip.added:hover { border-color: var(--line); }
  .week { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 10px; }
  .day {
    flex: 1; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 4px 0; font-size: 12px; line-height: 1.2;
  }
  .day.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .day.today { font-weight: 700; }
  .day span { display: block; font-size: 11px; opacity: .8; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Полезные привычки</h1>
    <p class="tagline">Каждый день отмечайте, что сделали, и следите за сериями дней подряд</p>
    <div class="date" id="today"></div>
  </header>

  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <form class="add" id="addForm">
    <input id="newHabit" placeholder="Новая привычка, например «Зарядка»" maxlength="80" autocomplete="off">
    <button type="submit">Добавить</button>
  </form>

  <details class="catalog" id="catalog">
    <summary>Выбрать из готового списка</summary>
    <div id="catalogBody"></div>
  </details>

  <ul class="habits" id="list"></ul>
  <p class="hint" id="hint">Нажмите на кружок, чтобы отметить привычку за сегодня. Дни недели внизу карточки — чтобы исправить прошлые отметки. 🎯 — поставить цель.</p>
</main>

<script>
const STORAGE_KEY = 'habit-trainer-v1';
const DAY_MS = 86400000;

// Даты храним как "YYYY-MM-DD" по местному времени.
function dateKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
// Номер дня (без влияния перехода на летнее время) для подсчёта серий.
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / DAY_MS);
}

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && Array.isArray(data.habits)) return data;
  } catch (e) {}
  return { habits: [] };
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();

// Максимальная серия и текущая серия (в днях).
// Текущая серия не обрывается, если сегодня ещё не отмечено, — считается до вчера.
function streaks(habit, todayKey) {
  const days = Object.keys(habit.done).filter(k => habit.done[k]).map(dayNumber).sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  for (const n of days) {
    run = (prev !== null && n === prev + 1) ? run + 1 : 1;
    best = Math.max(best, run);
    prev = n;
  }
  const set = new Set(days);
  let cursor = dayNumber(todayKey);
  if (!set.has(cursor)) cursor -= 1;
  let current = 0;
  while (set.has(cursor)) { current++; cursor--; }
  return { best, current };
}

function plural(n) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return 'дней';
  if (b === 1) return 'день';
  if (b >= 2 && b <= 4) return 'дня';
  return 'дней';
}

const CATALOG = [
  { title: 'Здоровье', items: ['💧 Выпить 2 литра воды', '🏃 Зарядка 10 минут', '🚶 Пройти 8 000 шагов', '😴 Лечь спать до 23:00', '🥗 Съесть овощи или фрукты', '🧘 Растяжка', '🚿 Контрастный душ'] },
  { title: 'Ум и развитие', items: ['📖 Читать 20 минут', '🗣️ Учить иностранный язык 15 минут', '🎧 Послушать подкаст или лекцию', '✍️ Вести дневник', '🧠 Решить задачу или головоломку'] },
  { title: 'Спокойствие', items: ['🧘 Медитация 10 минут', '🙏 Записать 3 вещи, за которые благодарен', '🌳 Прогулка на свежем воздухе', '📵 Час без телефона перед сном'] },
  { title: 'Продуктивность', items: ['📝 Составить план на день', '🧹 Убрать рабочее место', '⏰ Встать без «ещё 5 минут»', '💰 Записать расходы'] },
  { title: 'Отказ от вредного', items: ['🚭 Не курить', '🍬 Без сладкого', '🍺 Без алкоголя', '📱 Не больше часа соцсетей'] },
  { title: 'Близкие', items: ['📞 Позвонить родным', '💬 Сделать комплимент', '🤝 Помочь кому-нибудь'] },
];
const GOAL_PRESETS = [7, 21, 30, 66, 100];
let editingGoal = null; // id привычки, у которой открыт редактор цели

function renderCatalog() {
  const added = new Set(state.habits.map(h => h.name.toLowerCase()));
  const body = document.getElementById('catalogBody');
  body.innerHTML = '';
  for (const cat of CATALOG) {
    const sec = document.createElement('div');
    sec.className = 'cat';
    sec.innerHTML = `<h3>${cat.title}</h3>`;
    const chips = document.createElement('div');
    chips.className = 'chips';
    for (const item of cat.items) {
      const b = document.createElement('button');
      const isAdded = added.has(item.toLowerCase());
      b.className = 'chip' + (isAdded ? ' added' : '');
      b.textContent = isAdded ? item + ' ✓' : '+ ' + item;
      b.disabled = isAdded;
      b.title = isAdded ? 'Уже в вашем списке' : 'Добавить';
      b.onclick = () => addHabit(item);
      chips.appendChild(b);
    }
    sec.appendChild(chips);
    body.appendChild(sec);
  }
}

function setGoal(id, days) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  if (days) h.goal = days; else delete h.goal;
  editingGoal = null;
  save(); render();
}

function goalBlock(h, current) {
  const el = document.createElement('div');
  const reached = current >= h.goal;
  el.className = 'goal' + (reached ? ' reached' : '');
  const pct = Math.min(100, current / h.goal * 100);
  const left = h.goal - current;
  el.innerHTML = `<div class="goal-head"><span>🎯 Цель: <b>${h.goal}</b> ${plural(h.goal)} подряд</span>` +
    `<span>${reached ? 'Цель достигнута! 🎉' : `${current} / ${h.goal} · осталось ${left} ${plural(left)}`}</span></div>` +
    `<div class="goal-bar"><div class="goal-fill" style="width:${pct}%"></div></div>`;
  return el;
}

function goalEditor(h) {
  const el = document.createElement('div');
  el.className = 'goal-editor';
  el.innerHTML = '<p>Сколько дней подряд вы хотите выполнять эту привычку?</p>';
  const presets = document.createElement('div');
  presets.className = 'presets';
  for (const n of GOAL_PRESETS) {
    const b = document.createElement('button');
    b.className = 'chip' + (h.goal === n ? ' selected' : '');
    b.textContent = `${n} ${plural(n)}`;
    b.onclick = () => setGoal(h.id, n);
    presets.appendChild(b);
  }
  const custom = document.createElement('form');
  custom.className = 'custom';
  custom.innerHTML = '<span>Своё:</span><input type="number" min="1" max="3650" inputmode="numeric" placeholder="дней">' +
    '<button class="chip" type="submit">Сохранить</button>' +
    (h.goal ? '<button class="link-btn" type="button" data-remove>Убрать цель</button>' : '');
  const input = custom.querySelector('input');
  if (h.goal && !GOAL_PRESETS.includes(h.goal)) input.value = h.goal;
  custom.onsubmit = e => {
    e.preventDefault();
    const n = Math.round(Number(input.value));
    if (n >= 1 && n <= 3650) setGoal(h.id, n); else input.focus();
  };
  const rm = custom.querySelector('[data-remove]');
  if (rm) rm.onclick = () => setGoal(h.id, null);
  el.append(presets, custom);
  return el;
}

const TARGET_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>';
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function render() {
  const now = new Date();
  const todayKey = dateKey(now);
  document.getElementById('today').textContent =
    now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

  const week = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    week.push({ key: dateKey(d), label: d.toLocaleDateString('ru-RU', { weekday: 'short' }), num: d.getDate() });
  }

  const list = document.getElementById('list');
  list.innerHTML = '';
  let doneCount = 0;

  if (!state.habits.length) {
    list.innerHTML = '<li class="empty">Пока нет привычек. Добавьте первую — что вы хотите делать каждый день?</li>';
  }

  for (const h of state.habits) {
    const done = !!h.done[todayKey];
    if (done) doneCount++;
    const { best, current } = streaks(h, todayKey);

    const li = document.createElement('li');
    li.className = 'habit' + (done ? ' done' : '');

    const check = document.createElement('button');
    check.className = 'check';
    check.innerHTML = CHECK_SVG;
    check.setAttribute('aria-label', done ? 'Снять отметку' : 'Отметить выполненной');
    check.onclick = () => toggle(h.id, todayKey);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = h.name;

    const actions = document.createElement('div');
    actions.className = 'actions';
    const goalBtn = document.createElement('button');
    goalBtn.className = 'icon-btn' + (editingGoal === h.id ? ' active' : '');
    goalBtn.innerHTML = TARGET_SVG;
    goalBtn.title = h.goal ? 'Изменить цель' : 'Поставить цель';
    goalBtn.setAttribute('aria-label', goalBtn.title);
    goalBtn.onclick = () => { editingGoal = editingGoal === h.id ? null : h.id; render(); };
    const del = document.createElement('button');
    del.className = 'icon-btn delete';
    del.textContent = '×';
    del.title = 'Удалить привычку';
    del.setAttribute('aria-label', del.title);
    del.onclick = () => removeHabit(h.id);
    actions.append(goalBtn, del);

    const stats = document.createElement('div');
    stats.className = 'stats';
    stats.innerHTML = `<span>Текущая серия: <b>${current}</b> ${plural(current)}</span>` +
                      `<span>Рекорд: <b>${best}</b> ${plural(best)}</span>`;

    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    for (const d of week) {
      const b = document.createElement('button');
      b.className = 'day' + (h.done[d.key] ? ' on' : '') + (d.key === todayKey ? ' today' : '');
      b.innerHTML = `<span>${d.label}</span>${d.num}`;
      b.title = h.done[d.key] ? 'Выполнено — нажмите, чтобы снять' : 'Не выполнено — нажмите, чтобы отметить';
      b.onclick = () => toggle(h.id, d.key);
      weekEl.appendChild(b);
    }

    li.append(check, name, actions, stats);
    if (h.goal) li.appendChild(goalBlock(h, current));
    if (editingGoal === h.id) li.appendChild(goalEditor(h));
    li.appendChild(weekEl);
    list.appendChild(li);
  }

  const total = state.habits.length;
  document.getElementById('fill').style.width = total ? (doneCount / total * 100) + '%' : '0';
  document.getElementById('progressText').textContent = total
    ? `Сегодня выполнено ${doneCount} из ${total}` + (doneCount === total ? ' — отличный день! 🎉' : '')
    : '';
  document.getElementById('hint').hidden = !total;
  renderCatalog();
}

function toggle(id, key) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  if (h.done[key]) delete h.done[key]; else h.done[key] = true;
  save(); render();
}

function removeHabit(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h || !confirm(`Удалить привычку «${h.name}» вместе со статистикой?`)) return;
  state.habits = state.habits.filter(x => x.id !== id);
  save(); render();
}

function addHabit(name) {
  name = name.trim();
  if (!name) return false;
  if (state.habits.some(h => h.name.toLowerCase() === name.toLowerCase())) {
    alert(`Привычка «${name}» уже есть в списке.`);
    return false;
  }
  state.habits.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, done: {} });
  save(); render();
  return true;
}

document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newHabit');
  if (addHabit(input.value)) input.value = '';
});

// Перерисовываем при смене дня, если вкладка открыта через полночь.
let lastKey = dateKey(new Date());
setInterval(() => { const k = dateKey(new Date()); if (k !== lastKey) { lastKey = k; render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

// Пока привычек нет — сразу показываем готовый список.
document.getElementById('catalog').open = !state.habits.length;
render();
</script>
</body>
</html>
