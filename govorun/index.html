<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Говорун — тренажёр ораторского искусства: истории великих ораторов, голосовые тренировки и конструктор речи.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Говорун</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="me" id="me-btn" aria-label="Профиль">🦜</button>
      <button class="stat" id="stat-streak" aria-label="Ударный режим"><span class="stat-ico">🔥</span><span class="stat-val" id="streak-val">0</span></button>
      <button class="stat" id="stat-gems" aria-label="Очки харизмы"><span class="stat-ico">💎</span><span class="stat-val" id="gems-val">0</span></button>
      <button class="stat" id="stat-hearts" aria-label="Сердечки"><span class="stat-ico">❤️</span><span class="stat-val" id="hearts-val">5</span></button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tab active" data-tab="stories"><span class="tab-ico">📖</span><span class="tab-lbl">Истории</span></button>
      <button class="tab" data-tab="trainer"><span class="tab-ico">🎤</span><span class="tab-lbl">Тренажёр</span></button>
      <button class="tab" data-tab="builder"><span class="tab-ico">🧩</span><span class="tab-lbl">Конструктор</span></button>
    </nav>
  </div>

  <div id="lesson" class="lesson hidden" role="dialog" aria-modal="true"></div>
  <div id="profile" class="lesson hidden" role="dialog" aria-modal="true"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast"></div>
  <canvas id="confetti"></canvas>

  <script src="js/config.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
