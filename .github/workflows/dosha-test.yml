# Сборка приложения «Моя доша» (тест на определение доши) — отладочный APK.
# Готовый файл: вкладка Actions → последний запуск «Dosha test APK» → Artifacts → moya-dosha-debug.
name: Dosha test APK

on:
  push:
    paths:
      - 'dosha-test/**'
      - '.github/workflows/dosha-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dosha-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Сборка APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: moya-dosha-debug
          path: dosha-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
