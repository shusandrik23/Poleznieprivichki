# Сборка приложения «Мой список» (папка spisok/).
# Готовый файл: вкладка Actions → последний запуск «Spisok APK» → Artifacts → moy-spisok-apk.
name: Spisok APK

on:
  push:
    paths:
      - 'spisok/**'
      - '.github/workflows/spisok.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spisok
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Сборка APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: moy-spisok-apk
          path: spisok/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
